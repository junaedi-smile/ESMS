{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Konfirmasi Reset - INSIDE</title>
  <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head>
<body>
  <div class="login-card">
    <h3 class="brand-title">Buat Password Baru</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-login w-100 mt-3">Reset Password</button>
    </form>
  </div>
</body>
</html>
