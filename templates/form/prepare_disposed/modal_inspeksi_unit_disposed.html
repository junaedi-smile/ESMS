<div class="modal fade" id="inspectionModal" tabindex="-1" role="dialog" aria-labelledby="inspectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header bg-light py-2">
                <h5 class="modal-title fs-6 fw-bold" id="inspectionModalLabel">Form Checklist & Inspeksi Unit</h5>
                <button type="button" class="btn-close" onclick="closeInspectionModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                
                <!-- ================= HEADER DOKUMEN CHECK SHEET ================= -->
                <div class="border border-dark p-3 mb-3 bg-white text-dark">
                    <div class="row align-items-center border-bottom pb-3 mb-3">
                        <!-- Kolom Logo Perusahaan -->
                        <div class="col-3 text-center border-end">
                            <img src="/static/img/logo_perusahaan.png" alt="Logo PT Saptaindra Sejati" style="max-height: 50px; width: auto;" onerror="this.style.display='none';">
                            <div class="small fw-bold text-muted mt-1">PT Saptaindra Sejati</div>
                        </div>
                        <!-- Kolom Judul Dokumen -->
                        <div class="col-6 text-center">
                            <h4 class="fw-bold m-0 text-uppercase tracking-wide" style="font-size: 1.25rem;">INSPECTION EQUIPMENT CHECK SHEET</h4>
                            <span class="text-muted small">Asset Management Department</span>
                        </div>
                        <!-- Kolom Keterangan Tambahan (Opsional) -->
                        <div class="col-3 text-end small text-muted">
                            <div>Status: <span class="badge bg-warning text-dark">Prepared Disposed</span></div>
                        </div>
                    </div>

                    <!-- Informasi Spesifikasi Unit (Grid Data) -->
                    <div class="row g-2 small">
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>Equipment Type:</strong> <span id="header_type">-</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>CN SAP:</strong> <span id="header_cn_sap">-</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>Unit Model (EGI):</strong> <span id="header_egi">-</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>Serial Number (SN):</strong> <span id="header_sn">-</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>SMR (HM_SMR):</strong> <span id="header_hm_smr">-</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-2 border bg-light">
                                <strong>Plant Dept - Site:</strong> <span id="header_location">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- ================= END HEADER DOKUMEN ================= -->

                <!-- Tabel Item Inspeksi -->
                <div class="table-responsive" style="max-height: 350px; overflow-y: auto;">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark sticky-top">
                            <tr>
                                <th style="width: 5%;">No</th>
                                <th style="width: 20%;">Item Group</th>
                                <th style="width: 30%;">Item Name</th>
                                <th style="width: 10%;">Qty</th>
                                <th style="width: 15%;">Condition</th>
                                <th style="width: 20%;">Remark</th>
                            </tr>
                        </thead>
                        <tbody id="inspectionTableBody">
                            <!-- Data item akan di-generate otomatis via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeInspectionModal()">Batal</button>
                <button type="button" id="saveInspectionBtn" class="btn btn-primary" onclick="saveInspectionData()">Simpan Inspeksi</button>
            </div>
        </div>
    </div>
</div>
