{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
{% endblock %}

{% block content %}
    {{ block.super }}

    <div class="modal fade" id="uploadDocModal" tabindex="-1" aria-labelledby="modalDocTitle" aria-hidden="true" style="z-index: 1060;">
        <div class="modal-dialog modal-dialog-centered">
            <form id="uploadDocForm" method="POST" enctype="multipart/form-data" action="/asset/upload-quick-disposed/">
                {% csrf_token %}
                <div class="modal-content" style="border-radius: 8px;">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalDocTitle" style="font-weight: bold; color: #333;">Upload Dokumen</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="cn_sap" id="modalCnSap">
                        <input type="hidden" name="doc_type" id="modalDocType">
                        
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; color: #555;">Pilih File (<span id="labelDocName"></span>)</label>
                            <input type="file" name="document_file" class="form-control" required style="margin-top: 5px;">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary" style="background-color: #1883ff; border: none;">Simpan Dokumen</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

{% endblock %}
