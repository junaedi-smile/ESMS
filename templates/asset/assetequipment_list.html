{% extends "layouts/base.html" %}

{% block content %}
  <h1>Daftar Asset Equipments</h1>
  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Kondisi</th>
        <th>Kategori</th>
      </tr>
    </thead>
    <tbody>
      {% for item in equipments %}
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.nama }}</td>
          <td>{{ item.kondisi }}</td>
          <td>{{ item.kategori }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
