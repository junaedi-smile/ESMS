<div id="modalCapexOverlay" style="
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.55);
    z-index:9999; overflow-y:auto; padding:30px 0;
    box-sizing:border-box;">

    <div style="
        background:#fff; border-radius:12px;
        max-width:820px; width:92%; margin:0 auto;
        box-shadow:0 8px 32px rgba(0,0,0,0.25);">

        <div style="
            background:#1883ff; color:#fff; padding:16px 24px;
            border-radius:12px 12px 0 0;
            display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h3 style="margin:0;font-size:16px;">
                    📋 Buat Form Lampiran Capex
                </h3>
                <div id="modal-cn-sap-label"
                     style="font-size:12px;opacity:0.85;margin-top:3px;">
                </div>
            </div>
            <button type="button" id="closeCapexModalBtn" style="
                background:none;border:none;color:#fff;
                font-size:24px;cursor:pointer;line-height:1;">✕
            </button>
        </div>

        <div style="padding:24px;">

            <div id="modal-loading" style="
                text-align:center;padding:20px;color:#888;font-size:13px;">
                ⏳ Mengambil data unit...
            </div>

            <!-- ── Nomor Dokumen ───────────────────────────────── -->
                <fieldset style="border:1.5px solid #e0e0e0;border-radius:8px;
                    padding:16px 20px;margin-bottom:16px;">
                    <legend style="background:#e8f4fd;color:#1883ff;
                        padding:4px 12px;border-radius:20px;
                        font-size:12px;font-weight:600;">
                        📋 Nomor Dokumen
                    </legend>
                    <div style="display:grid;
                        grid-template-columns:1fr 1fr;gap:12px;">
                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                No. Dokumen (Sistem)
                            </label>
                            <input type="text" name="doc_number_auto"
                                id="modal-doc-number-auto"
                                readonly
                                placeholder="Auto-generated..."
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                background:#f5f5f5;font-size:13px;
                                box-sizing:border-box;"/>
                        </div>
                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                No. Dokumen (Manual)
                            </label>
                            <input type="text" name="doc_number_manual"
                                id="modal-doc-number-manual"
                                placeholder="Isi nomor dokumen manual..."
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>
                    </div>
                </fieldset>


            <div id="modal-unit-info" style="
                background:#f0f9f0;border:1px solid #28a745;
                border-radius:8px;padding:14px;margin-bottom:20px;
                display:none;">
                <strong style="color:#28a745;font-size:13px;">
                    ✅ Data unit:
                </strong>
                <div id="modal-preview-grid" style="
                    display:grid;
                    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
                    gap:8px;margin-top:10px;">
                </div>
            </div>
            
            <form id="capex-modal-form">
                {% csrf_token %}
                <input type="hidden" name="CN_SAP"         id="modal-CN_SAP"/>
                <input type="hidden" name="GROUP"          id="modal-GROUP"/>
                <input type="hidden" name="TYPE"           id="modal-TYPE"/>
                <input type="hidden" name="EGI"            id="modal-EGI"/>
                <input type="hidden" name="HM_SMR"         id="modal-HM_SMR"/>
                <input type="hidden" name="SPO_EQUIPMENT"  id="modal-SPO_EQUIPMENT"/>
                <input type="hidden" name="PERSENTASE_SPO" id="modal-PERSENTASE_SPO"/>
                <input type="hidden" name="NILAI_AKUISISI" id="modal-NILAI_AKUISISI"/>
                <input type="hidden" name="NBV"            id="modal-NBV"/>

                <fieldset style="
                    border:1.5px solid #e0e0e0;border-radius:8px;
                    padding:16px 20px;margin-bottom:16px;">
                    <legend style="
                        background:#fff8e1;color:#f57c00;
                        padding:4px 12px;border-radius:20px;
                        font-size:12px;font-weight:600;">
                        ✏️ Data Manual (wajib diisi)
                    </legend>

                    <div style="
                        display:grid;
                        grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
                        gap:12px;">
                        
                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">RV *</label>
                            <input type="number" name="RV" step="0.01" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Status NBV *</label>
                            <select name="NBV_STATUS" required style="width:100%;
                                padding:7px 10px;border:1.5px solid #ddd;
                                border-radius:6px;font-size:13px;
                                box-sizing:border-box;">
                                <option value="">-- Pilih --</option>
                                <option value="COMPLETE">Complete</option>
                                <option value="NOT_COMPLETE">Not Complete</option>
                            </select>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Date Delivery *</label>
                            <input type="date" name="DATE_DELIVERY" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Life Equipment *</label>
                            <input type="number" name="LIFE_EQUIPMENT" step="0.01"
                                required style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                Standar Depresiasi *</label>
                            <input type="number" name="STANDAR_DEPRE_EQUIPMENT"
                                step="0.01" required style="width:100%;
                                padding:7px 10px;border:1.5px solid #ddd;
                                border-radius:6px;font-size:13px;
                                box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Replacement *</label>
                            <input type="text" name="REPLACEMENT" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Kondisi Body *</label>
                            <input type="text" name="KONDISI_BODY" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Kondisi Frame *</label>
                            <input type="text" name="KONDISI_FRAME" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                Kondisi Komponen *</label>
                            <input type="text" name="KONDISI_KOMPONEN" required
                                style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                % Life Comp SPO *</label>
                            <input type="number" name="PROSENTASE_LIFE_COMP_SPO"
                                step="0.01" required style="width:100%;
                                padding:7px 10px;border:1.5px solid #ddd;
                                border-radius:6px;font-size:13px;
                                box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Cost Repair *</label>
                            <input type="number" name="COST_REPAIR" step="0.01"
                                required style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">Harga New *</label>
                            <input type="number" name="HARGA_NEW" step="0.01"
                                required style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                        <div>
                            <label style="font-size:11px;color:#555;font-weight:600;
                                display:block;margin-bottom:3px;">
                                Nilai Sisa Komponen *</label>
                            <input type="number" name="NILAI_SISA_COMP" step="0.01"
                                required style="width:100%;padding:7px 10px;
                                border:1.5px solid #ddd;border-radius:6px;
                                font-size:13px;box-sizing:border-box;"/>
                        </div>

                    </div>

                    <div style="margin-top:12px;">
                        <label style="font-size:11px;color:#555;font-weight:600;
                            display:block;margin-bottom:3px;">Obsolete *</label>
                        <textarea name="OBSOLETE" rows="3" required style="
                            width:100%;padding:7px 10px;border:1.5px solid #ddd;
                            border-radius:6px;font-size:13px;
                            box-sizing:border-box;"></textarea>
                    </div>
                </fieldset>

                <div id="modal-error" style="
                    display:none;background:#fff0f0;
                    border:1px solid #dc3545;border-radius:8px;
                    padding:12px;margin-bottom:14px;
                    color:#dc3545;font-size:13px;">
                </div>

                
                <!-- ── Tanda Tangan ────────────────────────────────── -->
                <fieldset style="border:1.5px solid #e0e0e0;border-radius:8px;
                    padding:16px 20px;margin-bottom:16px;">
                    <legend style="background:#f0fff0;color:#28a745;
                        padding:4px 12px;border-radius:20px;
                        font-size:12px;font-weight:600;">
                        ✍️ Tanda Tangan
                    </legend>
                    <div style="display:grid;
                        grid-template-columns:repeat(3,1fr);gap:12px;">

                        <!-- Dibuat -->
                        <div style="border:1px solid #ddd;border-radius:6px;
                            padding:10px;text-align:center;">
                            <div style="font-size:11px;color:#1883ff;font-weight:700;
                                margin-bottom:8px;">Dibuat Oleh</div>
                            <input type="text" name="dibuat_nama"
                                placeholder="Nama..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;margin-bottom:4px;
                                box-sizing:border-box;"/>
                            <input type="text" name="dibuat_jabatan"
                                placeholder="Jabatan..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;box-sizing:border-box;"/>
                        </div>

                        <!-- Diperiksa -->
                        <div style="border:1px solid #ddd;border-radius:6px;
                            padding:10px;text-align:center;">
                            <div style="font-size:11px;color:#1883ff;font-weight:700;
                                margin-bottom:8px;">Diperiksa Oleh</div>
                            <input type="text" name="diperiksa_nama"
                                placeholder="Nama..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;margin-bottom:4px;
                                box-sizing:border-box;"/>
                            <input type="text" name="diperiksa_jabatan"
                                placeholder="Jabatan..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;box-sizing:border-box;"/>
                        </div>

                        <!-- Disetujui -->
                        <div style="border:1px solid #ddd;border-radius:6px;
                            padding:10px;text-align:center;">
                            <div style="font-size:11px;color:#1883ff;font-weight:700;
                                margin-bottom:8px;">Disetujui Oleh</div>
                            <input type="text" name="disetujui_nama"
                                placeholder="Nama..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;margin-bottom:4px;
                                box-sizing:border-box;"/>
                            <input type="text" name="disetujui_jabatan"
                                placeholder="Jabatan..."
                                style="width:100%;padding:5px 8px;
                                border:1px solid #ddd;border-radius:4px;
                                font-size:11px;box-sizing:border-box;"/>
                        </div>
                    </div>
                </fieldset>

                <!-- ── Tombol (ganti yang lama) ───────────────────── -->
                <div style="display:flex;gap:10px;justify-content:flex-end;
                    flex-wrap:wrap;">
                    <button type="button" id="closeCapexModalBtn"
                        onclick="closeCapexModal()" style="
                        padding:9px 16px;background:#f0f0f0;color:#555;
                        border:1.5px solid #ddd;border-radius:7px;
                        font-size:13px;cursor:pointer;">
                        ✕ Batal
                    </button>
                    <button type="button" id="modal-btn-print"
                        onclick="printCapexForm()" style="
                        padding:9px 16px;background:#1883ff;color:#fff;
                        border:none;border-radius:7px;
                        font-size:13px;cursor:pointer;font-weight:600;">
                        🖨️ Print
                    </button>
                    <button type="button" id="modal-btn-download"
                        onclick="downloadCapexPDF()" style="
                        padding:9px 16px;background:#dc3545;color:#fff;
                        border:none;border-radius:7px;
                        font-size:13px;cursor:pointer;font-weight:600;">
                        📥 Download PDF
                    </button>
                    <button type="button" id="modal-btn-submit"
                        style="padding:9px 16px;background:#28a745;color:#fff;
                        border:none;border-radius:7px;
                        font-size:13px;cursor:pointer;font-weight:600;">
                        💾 Simpan & Submit Approval
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
