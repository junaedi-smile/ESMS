{% load static %}
<html><head>
  <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head><body>
<div class="login-card">
  <h4 class="brand-title">Reset Password</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="btn btn-login w-100 mt-3">Kirim Email Reset</button>
  </form>
  <div class="text-center mt-2"><a href="{% url 'login' %}">Kembali ke Login</a></div>
</div>
</body></html>
